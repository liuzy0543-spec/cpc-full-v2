[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cellpainting-claw"
version = "0.1.0"
description = "CellPainting-Claw: a standardized Cell Painting workflow library, CLI, skills layer, and agent integration surface"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "OpenAI Codex" }
]
keywords = ["cell-painting", "pycytominer", "cellprofiler", "image-analysis"]
dependencies = [
  "matplotlib",
  "numpy",
  "pandas",
  "Pillow",
  "pyarrow",
  "pycytominer",
  "scikit-learn",
  "tifffile",
]

[project.optional-dependencies]
data-access = [
  "boto3",
  "botocore",
  "cpgdata>=0.6.0",
  "quilt3",
]
deepprofiler = [
  # 0.3.1 declares only `packages=["deepprofiler"]`, so its subpackages never
  # install and `import deepprofiler.imaging` fails. 0.5.1 ships a usable tree.
  "deepprofiler==0.5.1",
  "tensorflow==2.10.1",
  "tensorflow-addons==0.20.0",
]
# Embedding layer, torch-backed methods only.  Kept separate from the
# TensorFlow-based `deepprofiler` extra because a deployment running CA-MAE,
# CellCLIP or O2-VAE needs none of TensorFlow.
embeddings = [
  "torch>=2.0",
  # torchvision: O2-VAE's upstream encoder imports it at module scope.
  "torchvision>=0.15",
  # timm: the OpenPhenom encoder imports timm.models.helpers.
  "timm>=0.9",
  "transformers>=4.36",
  "safetensors>=0.4",
  # e2cnn + torchgeometry: O2-VAE's rotation-equivariant encoder.  torchgeometry
  # 0.1.2 still calls numpy.float; the adapter installs the alias, so no pin.
  "e2cnn>=0.2",
  "torchgeometry>=0.1.2",
  "scikit-image>=0.21",
]
# Everything the four runnable embedding methods need, plus the benchmark
# scoring stack (pandas/scipy, but no deep-learning framework required).
embeddings-all = [
  "cellpainting-claw[deepprofiler]",
  "cellpainting-claw[embeddings]",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "tifffile>=2023.1",
]
mcp = [
  "mcp[cli]>=1,<2",
]
test = [
  "pytest>=8",
]
docs = [
  "sphinx>=8,<9",
  "myst-nb>=1,<2",
  "myst-parser>=3,<5",
  "furo>=2024.8.6",
]

[project.scripts]
cellpainting-claw = "cellpainting_claw.cli:main"
cellpainting-skills = "cellpainting_skills.cli:main"
cellpainting-claw-tests = "cellpainting_claw.test_suites:main"
cellpaint-pipeline = "cellpaint_pipeline.cli:main"
cellpaint-pipeline-tests = "cellpaint_pipeline.test_suites:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
